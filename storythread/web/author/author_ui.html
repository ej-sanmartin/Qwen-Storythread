<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storythread Author</title>
<style>
{{style}}
</style>
</head>
<body>
<header class="top">
  <h1>Storythread Author</h1>
  <span id="file" class="hint"></span>
  <button type="button" id="theme">Dark</button>
</header>
<main id="list-page" class="page">
  <div class="bar">
    <h2>Scenes</h2>
    <span id="count" class="hint"></span>
    <button type="button" id="new" class="primary">New scene</button>
  </div>
  <p id="list-error"></p>
  <table>
    <thead>
      <tr><th>Scene</th><th>Group</th><th>Turns</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="list-empty" class="hint" hidden>
    No scenes yet. Press New scene to write your first pair.
  </p>
</main>
<div id="confirm" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true"
       aria-labelledby="confirm-title">
    <h2 id="confirm-title">Delete this scene?</h2>
    <p id="confirm-text"></p>
    <p id="confirm-error" class="hint bad" hidden></p>
    <div class="btns">
      <button type="button" id="confirm-cancel">Cancel</button>
      <button type="button" id="confirm-ok" class="danger">Delete</button>
    </div>
  </div>
</div>
<div id="edit" hidden>
  <div class="toolbar">
    <a href="/">&larr; Scenes</a>
    <span id="title" class="title"></span>
    <span id="state" class="hint"></span>
    <span class="grow"></span>
    <label data-scenes-only>Token cap
      <input id="cap" type="number" min="1" step="1" value="512">
    </label>
    <button type="button" id="check" data-scenes-only>Check token counts</button>
    <button type="button" id="discard">Discard changes</button>
    <button type="button" id="save" class="primary">Save</button>
  </div>
  <div id="tokens"></div>
  <div class="cols">
    <section id="chat" aria-label="Story"></section>
    <div id="split" role="separator" aria-orientation="vertical"
         aria-label="Resize the sidebar" tabindex="0"></div>
    <aside id="side">
      <div id="problems" hidden></div>
      <div id="fields"></div>
    </aside>
  </div>
</div>
<script>
{{script}}
</script>
</body>
</html>
