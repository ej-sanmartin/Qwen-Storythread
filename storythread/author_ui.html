<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storythread Author</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --surface: #f4f4f5; --line: #e4e4e7;
    --text: #18181b; --muted: #71717a; --accent: #18181b;
    --on-accent: #ffffff; --select: #f4f4f5; --mark: #a1a1aa;
    --good: #15803d; --warn: #a16207; --bad: #b91c1c;
    --info: #1d4ed8;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111113; --surface: #1d1d20; --line: #2a2a2e;
    --text: #ececef; --muted: #8e8e96; --accent: #ececef;
    --on-accent: #111113; --select: #1d1d20; --mark: #52525b;
    --good: #4ade80; --warn: #facc15; --bad: #f87171;
    --info: #60a5fa;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 15px/1.45 system-ui, sans-serif;
  }
  h1 { margin: 0; font-size: 1rem; }
  h2 { margin: 0 0 0.4rem; font-size: 1rem; }
  h3 { margin: 0 0 0.4rem; font-size: 1rem; }
  button, input, select, textarea {
    color: inherit; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; font: inherit;
  }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--line);
  }
  #theme { padding: 0.2rem 0.6rem; font-size: 0.85rem; }
  .panes { flex: 1; display: flex; min-height: 0; }
  aside.list {
    width: 16rem; flex: none; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); min-height: 0;
  }
  .tools {
    display: flex; gap: 0.6rem; align-items: center;
    padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--line);
  }
  .tools button { padding: 0.35rem 0.6rem; }
  #count { margin: 0; color: var(--muted); }
  #scenes {
    list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1;
  }
  #scenes button {
    display: flex; flex-direction: column; width: 100%; text-align: left;
    border: 0; border-radius: 0; border-bottom: 1px solid var(--line);
    background: transparent; padding: 0.45rem 0.7rem;
  }
  #scenes button.selected { background: var(--select); }
  .sid {
    font-family: ui-monospace, monospace; font-size: 0.85rem;
    overflow-wrap: anywhere;
  }
  .group { color: var(--muted); font-size: 0.8rem; }
  .work { flex: 1; min-width: 0; display: flex; min-height: 0; }
  #empty { margin: 0; padding: 1rem; color: var(--muted); }
  #editor {
    flex: 1; min-width: 0; overflow: auto;
    padding: 0.9rem 1.1rem 1.4rem;
  }
  #checks {
    width: 18rem; flex: none; overflow: auto;
    border-left: 1px solid var(--line); padding: 0.9rem 1rem;
  }
  label { display: block; margin: 0.7rem 0 0.25rem; font-weight: 600; }
  label span { display: block; margin-bottom: 0.2rem; }
  input[type="text"], textarea, select { width: 100%; padding: 0.35rem; }
  textarea { min-height: 2.4rem; }
  .hint { color: var(--muted); font-weight: 400; }
  .turn {
    display: grid; grid-template-columns: 2rem 7.2rem minmax(0, 1fr) auto auto;
    gap: 0.35rem; align-items: start; margin: 0.35rem 0;
  }
  .num {
    font: 13px ui-monospace, monospace; padding-top: 0.45rem;
  }
  .turn select, .turn button { width: auto; }
  .turn button, .actions button, .ending button {
    padding: 0.35rem 0.55rem;
  }
  .endings {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;
    align-items: start; margin-top: 0.6rem;
  }
  .ending {
    border: 1px solid var(--line); border-radius: 8px; padding: 0.7rem;
  }
  .ending.missing { border-color: var(--bad); }
  .preview {
    min-height: 3rem; margin: 0.35rem 0; padding: 0.45rem 0.6rem;
    white-space: pre-wrap; overflow-wrap: anywhere;
    background: var(--surface); border-radius: 6px;
  }
  .distance { margin: 0.35rem 0 0; }
  .distance.bad { color: var(--bad); font-weight: 600; }
  .actions {
    display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end;
    margin: 0.9rem 0 0.4rem;
  }
  .actions label { margin: 0; }
  #cap { width: 6rem; }
  #save { background: var(--accent); color: var(--on-accent); }
  #tokens { margin: 0.4rem 0 0; }
  #tokens p { margin: 0.2rem 0; }
  #status { min-height: 1.2rem; margin: 0 0 0.4rem; }
  #status.ok { color: var(--good); }
  #problems { margin: 0; padding-left: 1.1rem; color: var(--bad); }
  #problems li.ok { color: var(--good); }
  @media (max-width: 980px) {
    .work { flex-direction: column; }
    #checks { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 800px) {
    .panes { flex-direction: column; overflow: auto; }
    aside.list { width: auto; max-height: 16rem; }
    .endings, .turn { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Storythread Author</h1>
  <button type="button" id="theme">Dark</button>
</header>
<div class="panes">
  <aside class="list">
    <div class="tools">
      <button type="button" id="new">New scene</button>
      <p id="count">0 saved</p>
    </div>
    <ul id="scenes"></ul>
  </aside>
  <div class="work">
    <p id="empty">Choose a saved scene or start a new one.</p>
    <section id="editor" hidden>
      <label><span>scenario_id</span>
        <input id="scenario_id" type="text" autocomplete="off">
      </label>
      <label><span>group</span>
        <input id="group" type="text" autocomplete="off">
      </label>
      <label><span>Character card</span>
        <textarea id="system" rows="3"></textarea>
      </label>
      <h2>Shared history</h2>
      <p class="hint">
        Turn numbers match evidence_turn. The card is not a turn.
      </p>
      <div id="history"></div>
      <button type="button" id="add-turn">Add turn</button>
      <div id="endings" class="endings"></div>
      <div class="actions">
        <button type="button" id="save">Save</button>
        <button type="button" id="discard">Discard unsaved</button>
        <label><span>Token cap</span>
          <input id="cap" type="number" min="1" step="1" value="512">
        </label>
        <button type="button" id="check">Check token counts</button>
      </div>
      <div id="tokens"></div>
    </section>
    <aside id="checks" hidden>
      <h2>Checks</h2>
      <p id="status"></p>
      <ul id="problems"></ul>
    </aside>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const DRAFT_KEY = "storythread-author-draft";
let scenes = [];
let state = null;
let keyCounter = 1;

// Returns the next stable id for a history turn.
function mintKey() {
  keyCounter += 1;
  return "t" + keyCounter;
}

// Returns an empty evidence ending.
function blankBranch() {
  return {
    user: "", reply: "", evidence: "", source: null, missing: false,
  };
}

// Returns a new unsaved scene with one assistant turn.
function blankScene() {
  const saved = Number(localStorage.getItem("author-cap"));
  return {
    originalId: null,
    scenario_id: "",
    group: "",
    system: "",
    history: [{key: mintKey(), role: "assistant", content: ""}],
    branches: {recent: blankBranch(), earlier: blankBranch()},
    cap: Number.isInteger(saved) && saved > 0 ? saved : 512,
    dirty: false,
    keyCounter: keyCounter,
  };
}

// Returns one ending, citing a history key or this ending's user turn.
function branchFrom(row, name, history) {
  const raw = (row.branches && row.branches[name]) || {};
  const index = raw.evidence_turn;
  let source = null;
  let missing = false;
  if (index === history.length) source = "self";
  else if (Number.isInteger(index) && history[index]) {
    source = history[index].key;
  } else if (Number.isInteger(index)) missing = true;
  return {
    user: raw.user || "",
    reply: raw.reply || "",
    evidence: typeof raw.evidence === "string" ? raw.evidence : "",
    source: source,
    missing: missing,
  };
}

// Returns editor state for a row loaded from the server.
function fromServer(row) {
  const history = (row.history || []).map((turn) => ({
    key: mintKey(),
    role: turn.role || "assistant",
    content: turn.content || "",
  }));
  const saved = Number(localStorage.getItem("author-cap"));
  return {
    originalId: row.scenario_id,
    scenario_id: row.scenario_id || "",
    group: row.group || "",
    system: row.system || "",
    history: history,
    branches: {
      recent: branchFrom(row, "recent", history),
      earlier: branchFrom(row, "earlier", history),
    },
    cap: Number.isInteger(saved) && saved > 0 ? saved : 512,
    dirty: false,
    keyCounter: keyCounter,
  };
}

// Returns the localStorage key for the open scene.
function draftKey() {
  return state && state.originalId ? state.originalId : "new";
}

// Returns the saved draft map, or an empty one.
function readDrafts() {
  try {
    const data = JSON.parse(localStorage.getItem(DRAFT_KEY) || "");
    if (data && data.items) return data;
  } catch (error) {
    // A damaged draft store is ignored.
  }
  return {items: {}};
}

// Returns the draft for key, or null when it is unusable.
function loadDraft(key) {
  const draft = readDrafts().items[key];
  if (!draft || !Array.isArray(draft.history)) return null;
  if (!draft.branches) return null;
  return draft;
}

// Stores the open scene so a refresh can restore it.
function persist() {
  if (!state) return;
  try {
    const all = readDrafts();
    state.keyCounter = keyCounter;
    all.items[draftKey()] = snapshot();
    all.active = draftKey();
    localStorage.setItem(DRAFT_KEY, JSON.stringify(all));
  } catch (error) {
    state.serverError = "Could not store unsaved edits in this browser.";
    renderErrors();
  }
}

// Drops one draft key after a save or discard.
function dropDraft(key) {
  const all = readDrafts();
  delete all.items[key];
  localStorage.setItem(DRAFT_KEY, JSON.stringify(all));
}

// Moves a draft when a new scene receives its id.
function retargetDraft(oldKey) {
  const all = readDrafts();
  state.keyCounter = keyCounter;
  if (oldKey !== draftKey()) delete all.items[oldKey];
  all.items[draftKey()] = snapshot();
  all.active = draftKey();
  localStorage.setItem(DRAFT_KEY, JSON.stringify(all));
}

// Returns the fields that survive a refresh.
function snapshot() {
  return {
    originalId: state.originalId,
    scenario_id: state.scenario_id,
    group: state.group,
    system: state.system,
    history: state.history,
    branches: state.branches,
    cap: state.cap,
    dirty: state.dirty,
    keyCounter: keyCounter,
  };
}

// Shows scene as the open editor. restored marks a reload of a draft.
function adopt(scene, restored) {
  keyCounter = scene.keyCounter || keyCounter;
  state = scene;
  state.serverError = "";
  state.savedNote = restored && scene.dirty ? "Restored unsaved edits." : "";
  document.title = (state.scenario_id || "New scene")
    + " · Storythread Author";
  render();
}

// Marks the editor dirty, stores it, and refreshes the checks.
function touch() {
  if (!state) return;
  state.dirty = true;
  state.savedNote = "";
  state.serverError = "";
  persist();
  renderStatus();
  renderErrors();
  clearTokens();
}

// Returns JSON or throws the server error string.
async function readJson(response) {
  let payload = {};
  try {
    payload = await response.json();
  } catch (error) {
    throw new Error("The editor returned an unreadable response.");
  }
  if (!response.ok) throw new Error(payload.error || "Request failed.");
  return payload;
}

// Fills the saved-scene list and the count.
async function loadList() {
  scenes = await readJson(await fetch("/api/scenes"));
  $("count").textContent = scenes.length + " saved";
  const list = $("scenes");
  list.replaceChildren();
  scenes.forEach((item) => {
    const li = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.id = item.scenario_id;
    const id = document.createElement("span");
    id.className = "sid";
    id.textContent = item.scenario_id || "(untitled)";
    const group = document.createElement("span");
    group.className = "group";
    group.textContent = item.group || "";
    button.append(id, group);
    li.append(button);
    list.append(li);
  });
  markSelected();
}

// Highlights the open saved scene in the list.
function markSelected() {
  const id = state && state.originalId;
  document.querySelectorAll("#scenes button").forEach((button) => {
    button.classList.toggle("selected", button.dataset.id === id);
  });
}

// Hides the editor until a scene is chosen.
function showEmpty() {
  state = null;
  $("editor").hidden = true;
  $("checks").hidden = true;
  $("empty").hidden = false;
  $("empty").textContent = "Choose a saved scene or start a new one.";
  document.title = "Storythread Author";
  markSelected();
}

// Copies identity fields from state into the form.
function fillIdentity() {
  $("scenario_id").value = state.scenario_id;
  $("group").value = state.group;
  $("system").value = state.system;
  $("cap").value = String(state.cap);
}

// Rebuilds the numbered history controls from state.
function renderHistory() {
  const root = $("history");
  root.replaceChildren();
  state.history.forEach((turn, index) => {
    const row = document.createElement("div");
    row.className = "turn";
    row.dataset.key = turn.key;
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = String(index);
    const role = document.createElement("select");
    role.dataset.field = "role";
    ["assistant", "user"].forEach((name) => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      if (name === turn.role) option.selected = true;
      role.append(option);
    });
    const content = document.createElement("textarea");
    content.dataset.field = "content";
    content.rows = 2;
    content.value = turn.content;
    const add = document.createElement("button");
    add.type = "button";
    add.dataset.action = "add-above";
    add.textContent = "Add above";
    const remove = document.createElement("button");
    remove.type = "button";
    remove.dataset.action = "remove";
    remove.textContent = "Remove";
    row.append(num, role, content, add, remove);
    root.append(row);
  });
}

// Returns a labeled textarea bound to field.
function field(label, name, value) {
  const wrap = document.createElement("label");
  const span = document.createElement("span");
  span.textContent = label;
  const input = document.createElement("textarea");
  input.dataset.field = name;
  input.rows = name === "evidence" ? 2 : 3;
  input.value = value;
  wrap.append(span, input);
  return wrap;
}

// Rebuilds the two ending cards from state.
function renderBranches() {
  const root = $("endings");
  root.replaceChildren();
  [
    ["recent", "Recent evidence"],
    ["earlier", "Earlier evidence"],
  ].forEach(([name, title]) => {
    const branch = state.branches[name];
    const card = document.createElement("section");
    card.className = "ending";
    card.dataset.branch = name;
    const heading = document.createElement("h3");
    heading.textContent = title;
    const source = document.createElement("label");
    const sourceText = document.createElement("span");
    sourceText.textContent = "Evidence turn";
    const select = document.createElement("select");
    select.dataset.field = "source";
    source.append(sourceText, select);
    const preview = document.createElement("p");
    preview.className = "preview";
    preview.dataset.preview = name;
    const copy = document.createElement("button");
    copy.type = "button";
    copy.dataset.action = "copy";
    copy.textContent = "Copy selection";
    const distance = document.createElement("p");
    distance.className = "distance";
    distance.dataset.distance = name;
    card.append(
      heading,
      field("Final user turn", "user", branch.user),
      field("Ideal character reply", "reply", branch.reply),
      source, preview, copy,
      field("Evidence quote", "evidence", branch.evidence),
      distance);
    root.append(card);
  });
  fillSources();
}

// Returns a select option.
function option(value, text) {
  const item = document.createElement("option");
  item.value = value;
  item.textContent = text;
  return item;
}

// Refills both evidence dropdowns without moving their citations.
function fillSources() {
  ["recent", "earlier"].forEach((name) => {
    const branch = state.branches[name];
    const select = document.querySelector(
      '[data-branch="' + name + '"] [data-field="source"]');
    const value = branch.missing ? "" : (branch.source || "");
    select.replaceChildren();
    select.append(option("", branch.missing
      ? "Cited turn was removed" : "Choose a turn"));
    state.history.forEach((turn, index) => {
      select.append(option(turn.key, index + " · " + turn.role));
    });
    const own = state.history.length + " · this ending's user turn";
    select.append(option("self", own));
    select.value = value;
    refreshBranch(name);
  });
}

// Returns the history index a citation still points at, or null.
function evidenceIndex(branch) {
  if (!branch || branch.missing || !branch.source) return null;
  if (branch.source === "self") return state.history.length;
  const index = state.history.findIndex((turn) => turn.key === branch.source);
  return index < 0 ? null : index;
}

// Returns the text of the cited turn, or the ending's own user turn.
function citedText(branch) {
  if (!branch || branch.missing || !branch.source) return "";
  if (branch.source === "self") return branch.user;
  const turn = state.history.find((item) => item.key === branch.source);
  return turn ? turn.content : "";
}

// Updates one ending's preview, distance, and removed-turn flag.
function refreshBranch(name) {
  const branch = state.branches[name];
  const card = document.querySelector('[data-branch="' + name + '"]');
  card.classList.toggle("missing", branch.missing);
  const blank = card.querySelector('[data-field="source"] option');
  if (blank) {
    blank.textContent = branch.missing
      ? "Cited turn was removed" : "Choose a turn";
  }
  const preview = card.querySelector("[data-preview]");
  preview.textContent = branch.missing ? "" : citedText(branch);
  const distance = card.querySelector("[data-distance]");
  if (branch.missing) {
    distance.textContent = "Cited turn was removed.";
    distance.className = "distance bad";
    return;
  }
  const index = evidenceIndex(branch);
  if (index === null) {
    distance.textContent = "Choose the turn this reply depends on.";
    distance.className = "distance hint";
    return;
  }
  const turns = state.history.length + 1 - index;
  const noun = turns === 1 ? "turn" : "turns";
  distance.textContent = turns + " " + noun
    + " from this turn to the final reply.";
  distance.className = "distance hint";
}

// Returns the quote highlighted inside preview, or "".
function selectedQuote(preview) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return "";
  const node = sel.getRangeAt(0).commonAncestorContainer;
  if (!preview.contains(node)) return "";
  return sel.toString();
}

// Copies the highlighted evidence text into that ending's quote.
function copySelection(name) {
  const card = document.querySelector('[data-branch="' + name + '"]');
  const quote = selectedQuote(card.querySelector("[data-preview]"));
  if (!quote.trim()) {
    state.serverError = "Select a quote in the evidence turn first.";
    renderErrors();
    return;
  }
  state.branches[name].evidence = quote;
  card.querySelector('[data-field="evidence"]').value = quote;
  state.serverError = "";
  touch();
}

// Returns live validation messages for the open scene.
function problems() {
  const found = [];
  if (!state.scenario_id.trim()) found.push("scenario_id is empty.");
  if (!state.group.trim()) found.push("group is empty.");
  if (!state.system.trim()) found.push("Character card is empty.");
  if (!state.history.length) {
    found.push("History needs at least one turn.");
  } else {
    state.history.forEach((turn, index) => {
      const where = "Turn " + index;
      if (turn.role !== "user" && turn.role !== "assistant") {
        found.push(where + ": role must be user or assistant.");
      } else if (index > 0 && turn.role === state.history[index - 1].role) {
        found.push(where + ": roles must alternate.");
      }
      if (!String(turn.content || "").trim()) {
        found.push(where + ": text is empty.");
      }
    });
    const last = state.history[state.history.length - 1];
    if (last.role !== "assistant") {
      found.push("History must end with an assistant turn.");
    }
  }
  const distance = {};
  ["recent", "earlier"].forEach((name) => {
    const branch = state.branches[name];
    const label = name === "recent" ? "Recent" : "Earlier";
    if (!branch.user.trim()) found.push(label + ": final user turn is empty.");
    if (!branch.reply.trim()) {
      found.push(label + ": ideal reply is empty.");
    }
    if (branch.missing) found.push(label + ": cited turn was removed.");
    else if (!branch.source) found.push(label + ": choose an evidence turn.");
    if (!String(branch.evidence || "").trim()) {
      found.push(label + ": evidence quote is empty.");
    } else if (branch.source && !branch.missing) {
      const host = citedText(branch);
      if (!host.includes(branch.evidence) ||
          !host.trim().includes(branch.evidence)) {
        found.push(label + ": evidence quote is not in the selected turn.");
      }
    }
    distance[name] = evidenceIndex(branch);
  });
  if (distance.recent !== null && distance.earlier !== null) {
    const recent = state.history.length + 1 - distance.recent;
    const earlier = state.history.length + 1 - distance.earlier;
    if (earlier <= recent) {
      found.push(
        "Earlier evidence must be farther from the reply than recent.");
    }
  }
  return found;
}

// Draws validation errors in the panel beside the editor.
function renderErrors() {
  const list = $("problems");
  list.replaceChildren();
  const items = state ? problems() : [];
  if (state && state.serverError && !items.includes(state.serverError)) {
    items.unshift(state.serverError);
  }
  if (!items.length) {
    const ok = document.createElement("li");
    ok.className = "ok";
    ok.textContent = "No problems.";
    list.append(ok);
    return;
  }
  items.forEach((text) => {
    const li = document.createElement("li");
    li.textContent = text;
    list.append(li);
  });
}

// Shows the saved or restored note above the checks.
function renderStatus() {
  const note = $("status");
  const text = state && state.savedNote || "";
  note.textContent = text;
  note.className = text.startsWith("Saved") ? "ok" : "hint";
}

// Clears a stale token report.
function clearTokens() {
  $("tokens").replaceChildren();
}

// Shows preflight counts and flags for both endings.
function renderTokens(report) {
  const root = $("tokens");
  root.replaceChildren();
  ["recent", "earlier"].forEach((name) => {
    const info = report[name];
    const flags = info.flags.length ? info.flags.join(", ") : "none";
    const line = document.createElement("p");
    line.textContent = name + ": " + info.full + " full (" + info.input
      + " input, " + info.target + " reply), " + info.distance_turns
      + " turns, evidence " + info.evidence_distance_tokens
      + " tokens, flags: " + flags;
    root.append(line);
  });
}

// Draws the open scene.
function render() {
  fillIdentity();
  renderHistory();
  renderBranches();
  renderStatus();
  renderErrors();
  $("editor").hidden = false;
  $("checks").hidden = false;
  $("empty").hidden = true;
  markSelected();
}

// Returns the scene in the authored file shape.
function payload() {
  function branch(name) {
    const item = state.branches[name];
    return {
      user: item.user,
      reply: item.reply,
      evidence_turn: evidenceIndex(item),
      evidence: item.evidence,
    };
  }
  return {
    scenario_id: state.scenario_id,
    group: state.group,
    system: state.system,
    history: state.history.map((turn) => ({
      role: turn.role, content: turn.content,
    })),
    branches: {recent: branch("recent"), earlier: branch("earlier")},
  };
}

// Applies stripped server text without detaching citation keys.
function applySavedText(scene) {
  (scene.history || []).forEach((turn, index) => {
    if (!state.history[index]) return;
    state.history[index].role = turn.role;
    state.history[index].content = turn.content;
  });
  ["recent", "earlier"].forEach((name) => {
    const raw = scene.branches[name];
    const branch = state.branches[name];
    branch.user = raw.user;
    branch.reply = raw.reply;
    branch.evidence = raw.evidence || "";
  });
}

// Inserts a turn before key. Citations stay on their original turns.
function insertBefore(key) {
  const index = state.history.findIndex((turn) => turn.key === key);
  if (index < 0) return;
  const prev = state.history[index - 1];
  const role = prev && prev.role === "assistant" ? "user" : "assistant";
  state.history.splice(index, 0, {key: mintKey(), role: role, content: ""});
  renderHistory();
  fillSources();
  touch();
}

// Removes a turn and flags endings that cited it.
function removeTurn(key) {
  const index = state.history.findIndex((turn) => turn.key === key);
  if (index < 0) return;
  state.history.splice(index, 1);
  ["recent", "earlier"].forEach((name) => {
    const branch = state.branches[name];
    if (branch.source === key) {
      branch.source = null;
      branch.missing = true;
    }
  });
  renderHistory();
  fillSources();
  touch();
}

// Appends one alternating turn.
function addTurn() {
  const prev = state.history[state.history.length - 1];
  const role = prev && prev.role === "assistant" ? "user" : "assistant";
  state.history.push({key: mintKey(), role: role, content: ""});
  renderHistory();
  fillSources();
  touch();
}

// Opens a saved scene, preferring its unfinished draft.
async function openSaved(id, fromPop) {
  if (state && state.dirty) persist();
  const url = "/scene/" + encodeURIComponent(id);
  if (!fromPop && decodeURIComponent(location.pathname) !== url) {
    history.pushState({}, "", url);
  }
  const draft = loadDraft(id);
  if (draft) {
    adopt(draft, true);
    return;
  }
  try {
    const row = await readJson(await fetch(
      "/api/scenes/" + encodeURIComponent(id)));
    adopt(fromServer(row), false);
  } catch (error) {
    showEmpty();
    $("empty").textContent = error.message;
  }
}

// Opens a new scene, or restores the unfinished one.
function openNew(fromPop) {
  if (state && state.dirty) persist();
  if (!fromPop && location.pathname !== "/new") {
    history.pushState({}, "", "/new");
  }
  const draft = loadDraft("new");
  adopt(draft || blankScene(), Boolean(draft));
}

// Follows the URL after load or back/forward.
function boot(fromPop) {
  const path = decodeURIComponent(location.pathname);
  if (path === "/new") return openNew(fromPop);
  const prefix = "/scene/";
  if (path.startsWith(prefix) && path.length > prefix.length) {
    return openSaved(path.slice(prefix.length), fromPop);
  }
  if (state && state.dirty) persist();
  showEmpty();
}

// Writes the open scene and leaves every other row untouched.
async function saveScene() {
  if (!state) return;
  const creating = !state.originalId;
  const oldKey = draftKey();
  const url = creating ? "/api/scenes"
    : "/api/scenes/" + encodeURIComponent(state.originalId);
  $("save").disabled = true;
  state.serverError = "";
  try {
    const body = await readJson(await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload()),
    }));
    applySavedText(body.scene);
    state.originalId = body.scene.scenario_id;
    state.scenario_id = body.scene.scenario_id;
    state.group = body.scene.group;
    state.system = body.scene.system;
    state.dirty = false;
    state.savedNote = "Saved " + state.originalId + ".";
    state.serverError = "";
    const next = "/scene/" + encodeURIComponent(state.originalId);
    if (decodeURIComponent(location.pathname) !== next) {
      history.pushState({}, "", next);
    }
    retargetDraft(oldKey);
    await loadList();
    render();
  } catch (error) {
    state.serverError = error.message;
    state.savedNote = "";
    renderStatus();
    renderErrors();
  } finally {
    $("save").disabled = false;
  }
}

// Drops the draft and reloads the saved row, or a blank scene.
async function discardScene() {
  if (!state) return;
  const key = draftKey();
  dropDraft(key);
  if (!state.originalId) {
    adopt(blankScene(), false);
    return;
  }
  try {
    const row = await readJson(await fetch(
      "/api/scenes/" + encodeURIComponent(state.originalId)));
    adopt(fromServer(row), false);
  } catch (error) {
    state.serverError = error.message;
    renderErrors();
  }
}

// Measures both endings with the cap in the form.
async function checkTokens() {
  if (!state) return;
  const cap = Number($("cap").value);
  if (!Number.isInteger(cap) || cap < 1) {
    state.serverError = "Token cap must be a positive integer.";
    renderErrors();
    return;
  }
  state.cap = cap;
  localStorage.setItem("author-cap", String(cap));
  persist();
  $("check").disabled = true;
  state.serverError = "";
  try {
    const report = await readJson(await fetch("/api/tokens", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(Object.assign({max_tokens: cap}, payload())),
    }));
    renderTokens(report);
    renderErrors();
  } catch (error) {
    clearTokens();
    state.serverError = error.message;
    renderErrors();
  } finally {
    $("check").disabled = false;
  }
}

// Updates one history turn and keeps citations on that same turn.
function onHistoryInput(event) {
  const row = event.target.closest("[data-key]");
  if (!row || !state) return;
  const turn = state.history.find((item) => item.key === row.dataset.key);
  if (!turn) return;
  const field = event.target.dataset.field;
  if (field === "role") turn.role = event.target.value;
  if (field === "content") turn.content = event.target.value;
  fillSources();
  touch();
}

// Adds or removes the history turn that was clicked.
function onHistoryClick(event) {
  const button = event.target.closest("button");
  if (!button || !state) return;
  const row = button.closest("[data-key]");
  if (!row) return;
  if (button.dataset.action === "add-above") insertBefore(row.dataset.key);
  if (button.dataset.action === "remove") removeTurn(row.dataset.key);
}

// Updates one ending field. A new choice clears a removed-turn flag.
function onBranchInput(event) {
  const card = event.target.closest("[data-branch]");
  if (!card || !state) return;
  const name = card.dataset.branch;
  const branch = state.branches[name];
  const field = event.target.dataset.field;
  if (!field) return;
  if (field === "source") {
    branch.source = event.target.value || null;
    branch.missing = false;
  } else {
    branch[field] = event.target.value;
  }
  refreshBranch(name);
  touch();
}

// Copies a selection when that ending's button is clicked.
function onBranchClick(event) {
  const button = event.target.closest("[data-action='copy']");
  if (!button || !state) return;
  const card = button.closest("[data-branch]");
  if (card) copySelection(card.dataset.branch);
}

// Stores the theme and updates the toggle label.
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("theme").textContent = theme === "dark" ? "Light" : "Dark";
}

["scenario_id", "group", "system"].forEach((id) => {
  $(id).addEventListener("input", () => {
    if (!state) return;
    state[id] = $(id).value;
    touch();
  });
});
$("cap").addEventListener("input", () => {
  if (!state) return;
  const cap = Number($("cap").value);
  if (Number.isInteger(cap) && cap > 0) {
    state.cap = cap;
    localStorage.setItem("author-cap", String(cap));
  }
  persist();
});
$("history").addEventListener("input", onHistoryInput);
$("history").addEventListener("change", onHistoryInput);
$("history").addEventListener("click", onHistoryClick);
$("endings").addEventListener("input", onBranchInput);
$("endings").addEventListener("change", onBranchInput);
$("endings").addEventListener("click", onBranchClick);
// Keep the highlighted quote when Copy selection is pressed.
$("endings").addEventListener("mousedown", (event) => {
  if (event.target.closest("[data-action='copy']")) event.preventDefault();
});
$("new").addEventListener("click", () => openNew(false));
$("add-turn").addEventListener("click", addTurn);
$("save").addEventListener("click", saveScene);
$("discard").addEventListener("click", discardScene);
$("check").addEventListener("click", checkTokens);
$("scenes").addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (button && button.dataset.id) openSaved(button.dataset.id, false);
});
window.addEventListener("popstate", () => boot(true));
window.addEventListener("pagehide", () => {
  if (state && state.dirty) persist();
});
const storedTheme = localStorage.getItem("author-theme");
const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches;
applyTheme(storedTheme || (systemTheme ? "dark" : "light"));
$("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark"
    ? "light" : "dark";
  localStorage.setItem("author-theme", next);
  applyTheme(next);
});
loadList().then(() => boot(false)).catch((error) => {
  $("empty").textContent = error.message;
});
</script>
</body>
</html>
